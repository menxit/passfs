name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: passfs-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Calculate semantic version
        id: version
        run: echo "value=$(./scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/check.yml

  linux:
    name: Linux binaries
    needs:
      - version
      - verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make linux-release RELEASE_VERSION="${{ needs.version.outputs.value }}"
      - name: Smoke-test installer
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          ./scripts/checksums.sh "release/v${VERSION}"
          openssl genpkey -algorithm Ed25519 \
            -out "$RUNNER_TEMP/update-smoke-key.pem"
          PASSFS_UPDATE_SIGNING_KEY="$(cat "$RUNNER_TEMP/update-smoke-key.pem")" \
            ./scripts/sign-release.sh "release/v${VERSION}"
          smoke_public_key="$(
            openssl pkey -in "$RUNNER_TEMP/update-smoke-key.pem" \
              -pubout -outform DER | base64 -w 0
          )"
          if [[ ! -e /dev/fuse ]]; then
            sudo mknod -m 0666 /dev/fuse c 10 229
          fi
          PASSFS_RELEASE_BASE="file://${GITHUB_WORKSPACE}/release" \
          PASSFS_VERSION="${VERSION}" \
          PASSFS_TEST_UPDATE_PUBLIC_KEY_DER_BASE64="$smoke_public_key" \
          PASSFS_INSTALL_DIR="${RUNNER_TEMP}/passfs-bin" \
          PASSFS_NO_MODIFY_PATH=1 \
            ./install.sh
          "${RUNNER_TEMP}/passfs-bin/passfs" version | grep -Fx "passfs ${VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passfs-linux-${{ needs.version.outputs.value }}
          path: release/v${{ needs.version.outputs.value }}/*
          if-no-files-found: error

  macos:
    name: Signed and notarized macOS installer
    needs:
      - version
      - verify
    runs-on: macos-latest
    environment:
      name: release
    env:
      SIGNING_CERTIFICATES: ${{ secrets.MACOS_SIGNING_CERTIFICATES_P12_BASE64 }}
      SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATES_PASSWORD }}
      PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
      FSKIT_PROVISIONING_PROFILE: ${{ secrets.MACOS_FSKIT_PROVISIONING_PROFILE_BASE64 }}
      NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Import Apple release credentials
        shell: bash
        run: |
          umask 077
          : "${SIGNING_CERTIFICATES:?missing signing certificates}"
          : "${SIGNING_CERTIFICATES_PASSWORD:?missing signing certificates password}"
          : "${PROVISIONING_PROFILE:?missing provisioning profile}"
          : "${FSKIT_PROVISIONING_PROFILE:?missing FSKit provisioning profile}"
          : "${NOTARY_KEY:?missing notarization key}"
          : "${NOTARY_KEY_ID:?missing notarization key ID}"
          : "${NOTARY_ISSUER_ID:?missing notarization issuer ID}"

          keychain_path="$RUNNER_TEMP/passfs-signing.keychain-db"
          keychain_password="$(uuidgen)"
          signing_certificates_path="$RUNNER_TEMP/signing-certificates.p12"
          profile_path="$RUNNER_TEMP/passfs.provisionprofile"
          fskit_profile_path="$RUNNER_TEMP/passfs-fskit.provisionprofile"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$SIGNING_CERTIFICATES" | base64 -D > "$signing_certificates_path"
          printf '%s' "$PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          printf '%s' "$FSKIT_PROVISIONING_PROFILE" | base64 -D > "$fskit_profile_path"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$signing_certificates_path" \
            -P "$SIGNING_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          {
            echo "PASSFS_KEYCHAIN=$keychain_path"
            echo "PASSFS_PROFILE=$profile_path"
            echo "PASSFS_FSKIT_PROFILE=$fskit_profile_path"
            echo "PASSFS_NOTARY_KEY=$notary_key_path"
          } >> "$GITHUB_ENV"
      - name: Build, sign, and notarize
        run: |
          make macos-release \
            RELEASE_VERSION="${{ needs.version.outputs.value }}" \
            RELEASE_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            MACOS_ARCHES="amd64 arm64" \
            MACOS_PROVISIONING_PROFILE="$PASSFS_PROFILE" \
            MACOS_FSKIT_PROVISIONING_PROFILE="$PASSFS_FSKIT_PROFILE" \
            MACOS_APPLICATION_SIGN_IDENTITY=auto \
            MACOS_INSTALLER_SIGN_IDENTITY=auto \
            MACOS_NOTARY_KEY="$PASSFS_NOTARY_KEY" \
            MACOS_NOTARY_KEY_ID="$NOTARY_KEY_ID" \
            MACOS_NOTARY_ISSUER_ID="$NOTARY_ISSUER_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passfs-macos-${{ needs.version.outputs.value }}
          path: release/v${{ needs.version.outputs.value }}/PassFS-macos-universal.pkg
          if-no-files-found: error
      - name: Remove temporary Keychain
        if: always()
        run: |
          if [[ -n "${PASSFS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$PASSFS_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/signing-certificates.p12" \
            "$RUNNER_TEMP/passfs.provisionprofile" \
            "$RUNNER_TEMP/passfs-fskit.provisionprofile" \
            "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: Publish GitHub release
    needs:
      - version
      - linux
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: passfs-*-${{ needs.version.outputs.value }}
          path: release/v${{ needs.version.outputs.value }}
          merge-multiple: true
      - name: Create checksums
        env:
          PASSFS_UPDATE_SIGNING_KEY: ${{ secrets.PASSFS_UPDATE_SIGNING_KEY }}
        run: |
          ./scripts/checksums.sh "release/v${{ needs.version.outputs.value }}"
          ./scripts/sign-release.sh "release/v${{ needs.version.outputs.value }}"
      - name: Publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "release/$tag"/* --clobber
          else
            gh release create "$tag" "release/$tag"/* \
              --title "passfs $tag" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

  pages:
    name: Build GitHub Pages
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download current release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir -p "release/v${VERSION}"
          gh release download "v${VERSION}" --dir "release/v${VERSION}"
      - name: Prepare Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PASSFS_FETCH_GITHUB_RELEASES: "1"
          PASSFS_VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/prepare-pages.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .pages

  deploy:
    name: Deploy GitHub Pages
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
