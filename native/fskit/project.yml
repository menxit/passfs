name: PassFSFileSystem

options:
  bundleIdPrefix: com.menxit.passfs
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  PassFSFileSystem:
    type: app-extension
    platform: macOS
    sources:
      - path: PassFSFileSystem
        excludes:
          - Info.plist
          - PassFSFileSystem.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menxit.passfs.filesystem
        PRODUCT_NAME: PassFSFileSystem
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PassFSFileSystem/Info.plist
        CODE_SIGN_ENTITLEMENTS: PassFSFileSystem/PassFSFileSystem.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: PassFSFileSystem/PassFSFileSystem-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(PASSFS_BRIDGE_ARCHIVE)"
          - "-framework"
          - AppKit
          - "-framework"
          - LocalAuthentication
          - "-framework"
          - Security
          - "-lresolv"
        CODE_SIGNING_ALLOWED: NO
